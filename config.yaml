# S.A.R.A Agent Configuration

# Active provider (custom, openai, gemini, copilot, anthropic, openrouter, groq, mistral, deepseek, xai, together, fireworks, perplexity, opencodezen, kimi, minimax, zai, nous)
provider:
  active: "custom"

# Provider configurations
providers:
  openai:
    api_key: ""  # Set via OPENAI_API_KEY env var
    model: "gpt-4o"
    base_url: "https://api.openai.com/v1"

  gemini:
    api_key: ""  # Set via GEMINI_API_KEY env var
    model: "gemini-3.8-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta"

  copilot:
    api_key: ""  # Set via COPILOT_GITHUB_TOKEN env var
    model: "gpt-4o"
    base_url: "https://api.githubcopilot.com"

  anthropic:
    api_key: ""  # Set via ANTHROPIC_API_KEY env var
    model: "claude-sonnet-4"
    base_url: "https://api.anthropic.com/v1"

  openrouter:
    api_key: ""  # Set via OPENROUTER_API_KEY env var
    model: "openai/gpt-4o"
    base_url: "https://openrouter.ai/api/v1"

  groq:
    api_key: ""  # Set via GROQ_API_KEY env var
    model: "llama-3.3-70b-versatile"
    base_url: "https://api.groq.com/openai/v1"

  mistral:
    api_key: ""  # Set via MISTRAL_API_KEY env var
    model: "mistral-large-latest"
    base_url: "https://api.mistral.ai/v1"

  deepseek:
    api_key: ""  # Set via DEEPSEEK_API_KEY env var
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"

  xai:
    api_key: ""  # Set via XAI_API_KEY env var
    model: "grok-2-latest"
    base_url: "https://api.x.ai/v1"

  together:
    api_key: ""  # Set via TOGETHER_API_KEY env var
    model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
    base_url: "https://api.together.xyz/v1"

  fireworks:
    api_key: ""  # Set via FIREWORKS_API_KEY env var
    model: "accounts/fireworks/models/llama-v3p3-70b-instruct"
    base_url: "https://api.fireworks.ai/inference/v1"

  perplexity:
    api_key: ""  # Set via PERPLEXITY_API_KEY env var
    model: "sonar"
    base_url: "https://api.perplexity.ai"

  opencodezen:
    api_key: ""  # Set via OPENCODE_ZEN_API_KEY env var
    model: "opencode-zen"
    base_url: "https://api.opencode.ai/v1"

  kimi:
    api_key: ""  # Set via KIMI_API_KEY env var
    model: "moonshot-v1-128k"
    base_url: "https://api.moonshot.ai/v1"

  minimax:
    api_key: ""  # Set via MINIMAX_API_KEY env var
    model: "MiniMax-M1"
    base_url: "https://api.minimax.io/v1"

  zai:
    api_key: ""  # Set via GLM_API_KEY env var
    model: "glm-4-plus"
    base_url: "https://open.bigmodel.cn/api/paas/v4"

  nous:
    api_key: ""  # Set via NOUS_API_KEY env var
    model: "meituan/longcat-2.5-preview:free"
    base_url: "https://inference-api.nousresearch.com/v1"

  custom:
    api_key: ""  # Optional API key
    model: "default"  # Model name
    base_url: ""  # Custom OpenAI-compatible URL

# Model settings
model:
  default: "S.A.R.A-v3c:latest"
  provider: "custom"
  base_url: "http://192.168.2.176:11434/v1"
  api_key: ""
  context_length: 65536

agent:
  max_turns: 90
  tool_use_enforcement: true

display:
  skin: "sara"
  interface: "cli"
  show_reasoning: true
  show_cost: false

memory:
  memory_enabled: true
  user_profile_enabled: true

# Web UI settings
web:
  host: "0.0.0.0"
  port: 8800
  enabled: true

# Authorization
auth:
  bypass_billing_for_authorized: true
  authorized_users_file: "sara_auth.py"
