<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTweaked Status</title>
<style>
  :root {
    --bg:#0b0e13; --panel:#151922; --panel-2:#1b212c; --ink:#e8ecf2;
    --muted:#8b94a3; --line:#262d3a; --accent:#5ad1a0; --accent-2:#6ea8fe;
    --warn:#f0b35a; --bad:#ef6f6f; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:radial-gradient(1200px 600px at 70% -10%, #16202c 0%, var(--bg) 55%);
    color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; min-height:100vh;
  }
  header {
    padding:1.4rem 1.5rem 1.1rem; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  }
  .brand h1 { margin:0; font-size:1.5rem; letter-spacing:.2px; }
  .brand h1 .chip {
    font-size:.7rem; vertical-align:middle; margin-left:.5rem; padding:.12rem .5rem;
    border:1px solid var(--line); border-radius:999px; color:var(--muted); letter-spacing:.08em;
  }
  .brand .sub { color:var(--muted); font-size:.88rem; margin-top:.15rem; }
  .brand nav { margin-top:.5rem; display:flex; gap:.9rem; }
  .brand nav a { color:var(--accent); text-decoration:none; font-size:.85rem; }
  .brand nav a:hover { text-decoration:underline; }
  .bar { margin-left:auto; display:flex; align-items:center; gap:.6rem; color:var(--muted); font-size:.85rem; }
  .dot { width:.55rem; height:.55rem; border-radius:50%; background:var(--muted);
         box-shadow:0 0 0 0 rgba(90,209,160,.5); }
  .dot.live { background:var(--accent); animation:pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(90,209,160,.45);} 70%{box-shadow:0 0 0 6px rgba(90,209,160,0);} 100%{box-shadow:0 0 0 0 rgba(90,209,160,0);} }

  main { max-width:1120px; margin:0 auto; padding:1.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:1rem; }
  .card {
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:14px; padding:1.05rem 1.2rem;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform:translateY(-2px); border-color:#33405a; }
  .card.offline { opacity:.5; }
  .top { display:flex; align-items:center; gap:.55rem; }
  .sdot { width:.5rem; height:.5rem; border-radius:50%; flex:none; }
  .sdot.online { background:var(--accent); }
  .sdot.offline { background:var(--muted); }
  .sdot.error { background:var(--bad); }
  .sdot.idle { background:var(--warn); }
  .name { font-weight:700; font-size:1.02rem; }
  .badge { margin-left:auto; font-size:.68rem; padding:.18rem .55rem; border-radius:999px;
           text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .badge.online { background:rgba(90,209,160,.14); color:var(--accent); }
  .badge.offline { background:rgba(139,148,163,.14); color:var(--muted); }
  .badge.error { background:rgba(239,111,111,.14); color:var(--bad); }
  .badge.idle { background:rgba(240,179,90,.14); color:var(--warn); }
  .meta { color:var(--muted); font-size:.8rem; margin:.4rem 0 .2rem; }
  .kv { display:flex; justify-content:space-between; gap:1rem; font-size:.84rem;
        padding:.22rem 0; border-top:1px solid var(--line); }
  .kv:first-of-type { border-top:none; }
  .kv .k { color:var(--muted); }
  .kv .v { font-family:var(--mono); }
  pre.data { background:#0d1118; border:1px solid var(--line); border-radius:9px; padding:.6rem .7rem;
             max-height:150px; overflow:auto; font-size:.72rem; color:#aeb9c9; margin:.7rem 0 0;
             font-family:var(--mono); white-space:pre-wrap; word-break:break-word; }
  .empty { text-align:center; color:var(--muted); padding:4rem 1rem; }
  .empty code { background:#11161f; padding:.1rem .4rem; border-radius:5px; color:#bcd; }
  footer { text-align:center; color:var(--muted); padding:1.5rem; font-size:.8rem; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>CCTweaked Status <span class="chip">CC:T</span></h1>
    <div class="sub">Live status from in-game computers</div>
    <nav><a href="/minecraft/">&larr; Minecraft</a></nav>
  </div>
  <div class="bar">
    <span class="dot" id="conn"></span>
    <span id="status">connecting…</span>
    <span id="count"></span>
  </div>
</header>
<main>
  <div class="grid" id="grid">
    <div class="empty" id="empty">No computers reporting yet. Flash <code>cc_status.lua</code> to a CC:T computer.</div>
  </div>
</main>
<footer>S.A.R.A · CCTweaked status dashboard</footer>
<script>
const POLL_MS = 4000;
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const conn = document.getElementById('conn');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function stateKey(c){
  if(!c.online) return 'offline';
  return (c.state||'running').toLowerCase();
}

function render(list){
  [...grid.querySelectorAll('.card')].forEach(n=>n.remove());
  if(!list.length){ if(!grid.contains(empty)) grid.appendChild(empty); empty.style.display='block'; countEl.textContent=''; return; }
  empty.style.display='none';
  let online=0;
  for(const c of list){
    const sk = stateKey(c);
    if(c.online) online++;
    const pos = c.position ? `x:${esc(c.position.x)} y:${esc(c.position.y)} z:${esc(c.position.z)}` : '—';
    const fuel = c.fuel!=null ? esc(c.fuel) : '—';
    const dataJson = Object.keys(c.data||{}).length ? JSON.stringify(c.data,null,1) : '{}';
    const seen = (c.last_seen||c.server_time||0)*1000;
    const card = document.createElement('div');
    card.className = 'card' + (c.online?'':' offline');
    card.innerHTML = `
      <div class="top">
        <span class="sdot ${sk}"></span>
        <span class="name">${esc(c.name)}</span>
        <span class="badge ${sk}">${sk}</span>
      </div>
      <div class="meta">${esc(c.type||'computer')}${c.label?(' · '+esc(c.label)):''}${c.id!=null?(' · #'+esc(c.id)):''}</div>
      <div class="kv"><span class="k">fuel</span><span class="v">${fuel}</span></div>
      <div class="kv"><span class="k">position</span><span class="v">${pos}</span></div>
      <div class="kv"><span class="k">last seen</span><span class="v">${esc(seen?new Date(seen).toLocaleTimeString():'—')}</span></div>
      <pre class="data">${esc(dataJson)}</pre>
    `;
    grid.appendChild(card);
  }
  countEl.textContent = `${online}/${list.length} online`;
}

async function poll(){
  try{
    const r = await fetch('/api/status', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const list = await r.json();
    conn.className='dot live'; statusEl.textContent='live';
    render(list);
  }catch(e){
    conn.className='dot'; statusEl.textContent='offline: '+e.message;
  }
}
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
